name: Build Luciernagas Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: |
          gradle clean build --no-daemon

      - name: Comprobar JAR
        run: |
          echo "=== ARCHIVOS GENERADOS ==="
          ls -lah build/libs/
          echo ""
          echo "=== CONTENIDO DEL JAR ==="
          for file in build/libs/*.jar; do
            echo "JAR: $file"
            jar tf "$file" | head -50
            echo ""
          done

      - name: Subir JAR del mod
        uses: actions/upload-artifact@v4
        with:
          name: Luciernagas-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
